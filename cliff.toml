# git-cliff ~ https://git-cliff.org/docs/configuration
#
# CHANGELOG.md is generated from the conventional-commit history (pull request
# titles, squash-merged into main). The release pull request rewrites it; never
# edit it by hand. Preview locally:
#
#     uvx git-cliff@2.14.2 --bumped-version          # the next version
#     uvx git-cliff@2.14.2 --bump --unreleased       # its changelog section
#
# The repository URL is a literal below rather than a `[remote.github]`
# section, which would make git-cliff call the GitHub API (needing a token) on
# every run.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Generated by [git-cliff](https://git-cliff.org/) from the commit history, so fix
a wrong entry in the commit it came from rather than here.

"""
# Group headings carry an `<!-- N -->` sort prefix that `striptags` removes on
# render, which is how git-cliff orders groups independently of their names.
body = """
{% set repo = "https://github.com/illesnagy1/pymusicbrainz" -%}
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% if commit.scope %} ({{ commit.scope }}){% endif %} \
([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
# Compare links as Keep a Changelog reference definitions, so the body stays
# readable as plain Markdown.
footer = """

{% set repo = "https://github.com/illesnagy1/pymusicbrainz" -%}
{% for release in releases -%}
{% if release.version and release.previous and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
{{ repo }}/compare/{{ release.previous.version }}...{{ release.version }}
{% elif release.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
{{ repo }}/releases/tag/{{ release.version }}
{% endif -%}
{% endfor -%}
"""
trim = true
output = "CHANGELOG.md"

[git]
conventional_commits = true
# Pull request titles are checked (pr-title.yml), so anything unconventional is
# noise from before that check existed.
filter_unconventional = true
# A commit parser marked `skip` must not silently swallow a breaking change.
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
commit_preprocessors = [
  # Squash merges append " (#123)": link it instead of leaving it bare.
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/illesnagy1/pymusicbrainz/pull/${1}))" },
  # `Closes: <url>` trailers belong on the commit, not in the changelog line.
  { pattern = '\n+(Closes|Fixes|Refs|Related to):.*', replace = "" },
]
# Which conventional-commit types reach the changelog, and under which heading.
# Types absent from this list fall through to the final catch-all and are
# dropped: chore, ci, docs, style and test are not user-visible.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^security", group = "<!-- 2 -->Security" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^(deps|chore\\(deps\\))", group = "<!-- 5 -->Dependencies" },
  { message = "^build", group = "<!-- 6 -->Build" },
  { message = "^revert", group = "<!-- 7 -->Reverted" },
  { message = "^.*", skip = true },
]

[bump]
# Matches `tag_pattern` above: git-cliff's own default ("0.1.0") does not.
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true
