# git-cliff: https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md from the conventional commits (squash-merged pull
# request titles). Preview the next release: uvx git-cliff@2.14.2 --bump --unreleased --output -

[changelog]
header = """
# Changelog

All notable changes, generated from the commit history. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% set repo = "https://github.com/illesnagy1/pymusicbrainz" -%}
## {% if version %}[{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}[Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
# Squash merges end the title with "(#123)": link it to the pull request.
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/illesnagy1/pymusicbrainz/pull/${1}))" },
]
# The commit types users care about; the rest (docs, test, ci, chore, style)
# are left out of the changelog.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^security", group = "Security" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^(deps|build)", group = "Dependencies" },
  { message = "^revert", group = "Reverted" },
  # A breaking change of any other type (chore!: ...) is still listed.
  { field = "breaking", pattern = "true", group = "Changed" },
  { message = ".*", skip = true },
]

[bump]
# Only for the very first release: the default ("0.1.0") lacks the "v" that
# the workflows' tags have. Later versions follow the latest tag.
initial_tag = "v0.1.0"
