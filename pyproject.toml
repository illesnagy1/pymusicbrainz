[project]
name = "musicbrainz"
version = "0.1.0"
description = "Typed sync + async client for the MusicBrainz WS/2 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "typing-extensions>=4.13",
]

[project.scripts]
musicbrainz = "musicbrainz:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "griffe-pydantic>=1.3.2",
    "mkdocstrings-python>=2.0.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
    "zensical>=0.1.0",
]

[tool.coverage.run]
branch = true
source = ["musicbrainz"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    'raise AssertionError\("unreachable"\)',
    'if __name__ == "__main__":',
]
