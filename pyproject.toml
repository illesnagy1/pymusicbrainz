[project]
name = "musicbrainz"
version = "0.1.0"
description = "Typed sync + async client for the MusicBrainz WS/2 API"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx2>=2.16.0",
    "pydantic>=2.14.3",
    "zensical>=0.1.0",
]

[project.scripts]
musicbrainz = "musicbrainz:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
