[project]
name = "pymusicbrainz"
version = "0.2.0"
description = "Typed sync + async client for the MusicBrainz WS/2 API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["musicbrainz", "cover art archive", "music", "metadata", "api client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "pydantic>=2.14.3",
    "typing-extensions>=4.13",
]

[project.urls]
Homepage = "https://github.com/illesnagy1/pymusicbrainz"
Documentation = "https://illesnagy1.github.io/pymusicbrainz/"
Repository = "https://github.com/illesnagy1/pymusicbrainz"
Issues = "https://github.com/illesnagy1/pymusicbrainz/issues"
Changelog = "https://github.com/illesnagy1/pymusicbrainz/releases"

[project.optional-dependencies]
cli = ["rich>=15.0.0", "typer>=0.28.0"]
socks = ["httpx2[socks]"]

[project.scripts]
pymusicbrainz = "pymusicbrainz:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pymusicbrainz[cli]",
    "discid>=1.4.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
    { include-group = "docs" },
]

docs = [
    "griffe-pydantic>=1.3.2",
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.1.0",
]

[tool.pytest.ini_options]
# scripts/roundtrip.py and record_fixtures.py are shared with the tests.
pythonpath = ["scripts"]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.coverage.run]
branch = true
source = ["pymusicbrainz"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    'raise AssertionError  # unreachable',
    'if __name__ == "__main__":',
]
