line-length = 88

[lint]
# Added on top of Ruff's default rule set (https://docs.astral.sh/ruff/default-rules/)
extend-select = [
  "A",  # flake8-builtins: shadowing builtins
  "ANN",  # flake8-annotations: missing type annotations
  "ARG",  # flake8-unused-arguments
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "C90",  # mccabe: cyclomatic complexity
  "D",  # pydocstyle: docstring presence and Google style (see lint.pydocstyle)
  "DOC102",  # Args: documents a parameter the function doesn't have
  "DOC201",  # missing Returns:
  "DOC202",  # Returns: on a function that returns nothing
  "DOC402",  # missing Yields:
  "DOC403",  # Yields: on a function that yields nothing
  "DOC501",  # raised exception missing from Raises:
  "DOC502",  # Raises: lists an exception that isn't raised
  "DTZ",  # flake8-datetimez: naive datetimes
  "E",  # pycodestyle errors
  "EM",  # flake8-errmsg: assign exception messages to a variable first
  "F",  # pyflakes
  "FURB",  # refurb: modern idioms
  "G",  # flake8-logging-format
  "I002",  # missing required import (see lint.isort); not in the defaults
  "ICN",  # flake8-import-conventions
  "LOG",  # flake8-logging
  "N",  # pep8-naming
  "PERF",  # perflint
  "PGH",  # pygrep-hooks: blanket noqa / type: ignore
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific: includes RUF100 (unused noqa)
  "S",  # flake8-bandit: security
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self: private member access
  "T20",  # flake8-print: print()/pprint() left in library code
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops: exception handling
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]
# Deliberately NOT enabled beyond the defaults (whose small FA, TC and ISC
# subsets are compatible with the reasons below):
#   COM, Q, ISC001: conflict with the ruff formatter.
#   TC: breaks pydantic, which resolves annotations at runtime.
#   FBT: false positives on typer's boolean CLI options.
ignore = [
  "D105",  # magic methods (__repr__, __iter__, ...) are self-explanatory
  "PLR0913",  # too-many-arguments: typer commands take one parameter per option
]

preview = true
explicit-preview-rules = true

[lint.isort]
# requires-python is 3.12: annotations are only lazy from 3.14 (PEP 649), so
# forward references (pydantic models, the session/resource classes) need this.
required-imports = ["from __future__ import annotations"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = [
  "D1",  # test names describe the test; docstrings optional (style still checked)
  "PLR2004",  # literal expected values are clearer than named constants
  "S101",  # assert is the point of a test
  "S106",  # dummy credentials for auth tests
  "S314",  # parsing XML the library itself just generated
]
# Command-line scripts report to stdout on purpose.
"{scripts,examples}/**" = ["T201"]

[format]
line-ending = "lf"
docstring-code-format = true
