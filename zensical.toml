[project]
site_name = "musicbrainz"
site_description = "A typed sync and async Python client for the MusicBrainz WS/2 API."
docs_dir = "docs"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Lookups & includes" = "guide/lookups.md" },
    { "Browse & pagination" = "guide/browse.md" },
    { "Search" = "guide/search.md" },
    { "Other lookups" = "guide/other-lookups.md" },
    { "Cover art" = "guide/cover-art.md" },
    { "Collections & submissions" = "guide/collections-submissions.md" },
    { "Async" = "guide/async.md" },
    { "Rate limiting, errors & logging" = "guide/reliability.md" },
  ] },
  { "Command line" = "cli.md" },
  { "API reference" = [
    { "Clients" = "reference/client.md" },
    { "Models" = "reference/models.md" },
    { "Errors" = "reference/errors.md" },
    { "Query helpers" = "reference/query.md" },
    { "Constants" = "reference/constants.md" },
  ] },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

# API reference generated from docstrings.
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = [{ griffe_pydantic = { schema = false } }]
docstring_style = "google"
filters = ["!^_"]
heading_level = 2
inherited_members = true
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
