name: API check
# Weekly: fetch fresh responses from MusicBrainz and the Cover Art Archive and
# check they still survive the client's models (scripts/record_fixtures.py
# --check). An incompatibility opens (or updates) one issue labelled
# api-compatibility; a passing run closes it. An unreachable API only fails the
# run. GitHub disables scheduled workflows after 60 days without repository
# activity: re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
env:
  LABEL: api-compatibility
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open, update or close the compatibility issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install
        run: uv sync --locked
      - name: Check the live API
        id: check
        run: |
          report="$RUNNER_TEMP/report.md"
          set +e
          uv run python scripts/record_fixtures.py --check --report "$report"
          status=$?
          set -e
          # No report means the script itself failed: never mistake that for
          # an API change.
          if [[ ! -s "$report" ]]; then
            echo "::error::The check crashed before writing a report."
            status=99
          else
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
      - name: Open or update the compatibility issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "$LABEL" --force --color B60205 \
            --description "The live MusicBrainz API no longer matches the client"
          { cat "$RUNNER_TEMP/report.md"; echo; echo "Found by [the weekly API check](${RUN_URL})."; } > "$RUNNER_TEMP/body.md"
          issue=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/body.md"
            gh issue comment "$issue" --body "Still incompatible: ${RUN_URL}"
          else
            gh issue create --title "MusicBrainz API compatibility problem" \
              --label "$LABEL" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Close the compatibility issue
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "Compatible again: ${RUN_URL}"
          fi
      - name: Fail the run unless compatible
        if: steps.check.outputs.status != '0'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          case "$STATUS" in
            1) echo "::error::The live API is incompatible; see the api-compatibility issue." ;;
            2) echo "::error::MusicBrainz or the Cover Art Archive could not be reached; no issue opened." ;;
          esac
          exit 1
